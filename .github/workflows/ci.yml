name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: detect self-host changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selfhost: ${{ steps.filter.outputs.selfhost }}
      selfhost_runtime: ${{ steps.filter.outputs.selfhost_runtime }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}): enabling self-host jobs."
            echo "selfhost=true" >> "$GITHUB_OUTPUT"
            echo "selfhost_runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            echo "::warning::Could not resolve HEAD^1 for PR diff; running self-host jobs."
            echo "selfhost=true" >> "$GITHUB_OUTPUT"
            echo "selfhost_runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^1 HEAD)"
          selfhost="false"
          selfhost_runtime="false"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docker-compose.selfhost*|\
              infra/selfhost/*|\
              scripts/*|\
              wrangler*.jsonc|\
              migrations/*|\
              workers/dispatcher/*|\
              package.json|\
              bun.lock|\
              vite.config.*|\
              react-router.config.*|\
              .github/workflows/ci.yml|\
              .github/workflows/selfhost-images.yml|\
              .github/actions/setup-bun/*)
                selfhost="true"
                ;;
            esac
            case "$file" in
              workers/main/*-container.Dockerfile|\
              workers/main/analysis-sandbox-assets/*|\
              workers/main/db-query-sandbox-assets/*|\
              workers/main/project-build-sandbox-warmup/*|\
              workers/main/project-build-sandbox-assets/*|\
              workers/main/eval-egress-fix/*|\
              infra/selfhost/*|\
              docker-compose.selfhost*|\
              scripts/selfhost-*|\
              scripts/test-selfhost-*|\
              package.json|\
              bun.lock|\
              .github/workflows/ci.yml|\
              .github/actions/setup-bun/*)
                selfhost_runtime="true"
                ;;
            esac
          done <<< "$changed"

          echo "selfhost=${selfhost}"
          echo "selfhost_runtime=${selfhost_runtime}"
          echo "selfhost=${selfhost}" >> "$GITHUB_OUTPUT"
          echo "selfhost_runtime=${selfhost_runtime}" >> "$GITHUB_OUTPUT"

  build:
    name: typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-bun
      - run: bun run check:unbounded-pi-core
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:discord-bridge
      - run: bun run build

  selfhost:
    name: self-host Docker and workerd
    needs: changes
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-bun
      - run: bun run selfhost:init
      - run: docker compose --env-file .env.selfhost -f docker-compose.selfhost.yml config --quiet
      - name: Smoke bundled agent runtime
        run: |
          compose() {
            docker compose --env-file .env.selfhost \
              -f docker-compose.selfhost.yml \
              "$@"
          }
          cleanup() {
            exit_code=$?
            if (( exit_code != 0 )); then
              compose ps --all || true
              compose logs --tail=200 agent-runtime-postgres agent-runtime || true
            fi
            compose down --volumes || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          compose pull --quiet agent-runtime-postgres agent-runtime
          compose up --detach --wait --wait-timeout 180 agent-runtime-postgres agent-runtime
          compose images agent-runtime-postgres agent-runtime
          node scripts/selfhost-agent-runtime-smoke.mjs --pinned
      - name: Validate bundled Pomerium overlay
        run: |
          compose() {
            docker compose --env-file .env.selfhost \
              -f docker-compose.selfhost.yml \
              -f docker-compose.selfhost.pomerium.yml \
              "$@"
          }
          cleanup() {
            exit_code=$?
            if (( exit_code != 0 )); then
              compose ps --all || true
              compose logs --tail=200 pomerium || true
            fi
            compose down --volumes || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          {
            echo "SELFHOST_TLS_MODE=external"
            echo "POMERIUM_IDP_PROVIDER_URL=https://accounts.example.com"
            echo "POMERIUM_IDP_CLIENT_ID=ci-client"
            echo "POMERIUM_IDP_CLIENT_SECRET=ci-secret"
          } >> .env.selfhost
          bun run selfhost:configure
          compose config --quiet
          compose up --detach pomerium
          healthy=0
          for attempt in {1..30}; do
            if compose exec -T pomerium pomerium health; then
              healthy=1
              break
            fi
            sleep 1
          done
          if (( healthy == 0 )); then
            echo "Pomerium did not become healthy within 30 seconds" >&2
            exit 1
          fi
      - run: bun run test:selfhost

  selfhost-runtime:
    name: self-host attached container runtimes
    needs: changes
    if: needs.changes.outputs.selfhost_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-bun
      - uses: docker/setup-buildx-action@v3
      - name: Build self-host project sandbox
        run: >
          docker buildx build
          --load
          --cache-from type=gha,scope=selfhost-project-build
          --cache-to type=gha,mode=max,scope=selfhost-project-build
          --tag camelai-selfhost-project-build:1.0.0
          --file workers/main/project-build-container.Dockerfile
          workers/main
      - name: Build self-host container egress interceptor
        run: >
          docker buildx build
          --load
          --cache-from type=gha,scope=selfhost-container-egress
          --cache-to type=gha,mode=max,scope=selfhost-container-egress
          --tag camelai-selfhost-container-egress:0.12.0
          workers/main/eval-egress-fix
      - name: Build self-host analysis sandbox
        run: >
          docker buildx build
          --load
          --cache-from type=gha,scope=selfhost-analysis
          --cache-to type=gha,mode=max,scope=selfhost-analysis
          --tag camelai-selfhost-analysis:1.0.0
          --file workers/main/analysis-container.Dockerfile
          workers/main
      - name: Build self-host DB query sandbox
        run: >
          docker buildx build
          --load
          --cache-from type=gha,scope=selfhost-db-query
          --cache-to type=gha,mode=max,scope=selfhost-db-query
          --tag camelai-selfhost-db-query:1.0.0
          --file workers/main/db-query-container.Dockerfile
          workers/main
      - name: Smoke project build runtime
        run: node scripts/selfhost-container-smoke.mjs project
      - name: Smoke analysis notebook and ZIP runtime
        run: node scripts/selfhost-container-smoke.mjs analysis
      - name: Smoke DB query drivers
        run: node scripts/selfhost-container-smoke.mjs db-query

  tests:
    # The client (jsdom) and worker (miniflare/workerd) suites share no state and
    # each is dominated by per-file environment startup, so we both split them
    # into separate jobs AND shard each suite across runners with vitest --shard.
    # vitest distributes test FILES across shards, so the per-file jsdom/workerd
    # boot cost (the bottleneck) parallelizes near-linearly: ~11min sequential ->
    # ~2-3min. Workers (~402s) gets 4 shards; client (~256s) gets 2.
    # Only trusted branch workflows can use azure-ci; PRs always use GitHub-hosted runners.
    name: tests (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }})
    timeout-minutes: 30
    runs-on: ${{ fromJSON((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: client, command: test:run, shard: 1, total: 2 }
          - { suite: client, command: test:run, shard: 2, total: 2 }
          - { suite: workers, command: test:workers, shard: 1, total: 4 }
          - { suite: workers, command: test:workers, shard: 2, total: 4 }
          - { suite: workers, command: test:workers, shard: 3, total: 4 }
          - { suite: workers, command: test:workers, shard: 4, total: 4 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-bun
      - run: bun run ${{ matrix.command }} -- --shard=${{ matrix.shard }}/${{ matrix.total }} --maxWorkers=2
