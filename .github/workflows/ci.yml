name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  chat-lifecycle-model:
    name: chat lifecycle model (${{ matrix.config }} - ${{ matrix.coverage }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - config: A
            coverage: dedupe-thread-full
          - config: B
            coverage: fifo-two-row
          - config: C
            coverage: batch-two-call-recovery
          - config: D
            coverage: queue-bound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download pinned TLA+ tools
        run: |
          curl -fL --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o /tmp/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar' \
            | sha256sum --check --strict
      - name: Model-check bounded chat lifecycle
        working-directory: plans/chat-runtime-correctness/formal
        env:
          TLC_CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          tlc_state_dir="$(mktemp -d "${RUNNER_TEMP}/chat-tlc-${TLC_CONFIG}.XXXXXX")"
          case "$tlc_state_dir" in
            "${RUNNER_TEMP}"/chat-tlc-*) ;;
            *) echo "Unexpected TLC state directory: $tlc_state_dir" >&2; exit 1 ;;
          esac
          cleanup() {
            rm -rf -- "$tlc_state_dir"
          }
          trap cleanup EXIT
          /usr/bin/time -v timeout --signal=INT --kill-after=30s 50m \
            java -Xmx4g -XX:+UseParallelGC \
            -cp /tmp/tla2tools.jar tlc2.TLC \
            -config "ChatLifecycle${TLC_CONFIG}.cfg" \
            -workers 2 -lncheck final -checkpoint 1000 \
            -metadir "$tlc_state_dir" ChatLifecycle.tla
      - name: Check TypeScript/model action conformance
        run: node scripts/check-chat-runtime-conformance.mjs
      - name: Enforce chat runtime source-size budget
        run: node scripts/check-chat-runtime-size.mjs

  selfhost:
    name: self-host Docker and workerd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run selfhost:init
      - run: docker compose --env-file .env.selfhost -f docker-compose.selfhost.yml config --quiet
      - name: Validate bundled Pomerium overlay
        run: |
          compose() {
            docker compose --env-file .env.selfhost \
              -f docker-compose.selfhost.yml \
              -f docker-compose.selfhost.pomerium.yml \
              "$@"
          }
          cleanup() {
            exit_code=$?
            if (( exit_code != 0 )); then
              compose ps --all || true
              compose logs --tail=200 pomerium || true
            fi
            compose down --volumes || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          {
            echo "SELFHOST_TLS_MODE=external"
            echo "POMERIUM_IDP_PROVIDER_URL=https://accounts.example.com"
            echo "POMERIUM_IDP_CLIENT_ID=ci-client"
            echo "POMERIUM_IDP_CLIENT_SECRET=ci-secret"
          } >> .env.selfhost
          bun run selfhost:configure
          compose config --quiet
          compose up --detach pomerium
          healthy=0
          for attempt in {1..30}; do
            if compose exec -T pomerium pomerium health; then
              healthy=1
              break
            fi
            sleep 1
          done
          if (( healthy == 0 )); then
            echo "Pomerium did not become healthy within 30 seconds" >&2
            exit 1
          fi
      - run: bun run test:selfhost

  selfhost-runtime:
    name: self-host attached container runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: docker/setup-buildx-action@v3
      - run: bun install --frozen-lockfile
      - name: Build self-host project sandbox
        run: >
          docker buildx build
          --load
          --cache-from type=gha,scope=selfhost-project-build
          --cache-to type=gha,mode=max,scope=selfhost-project-build
          --tag camelai-selfhost-project-build:0.12.0
          --file workers/main/project-build-sandbox.Dockerfile
          workers/main
      - name: Build self-host container egress interceptor
        run: >
          docker buildx build
          --load
          --cache-from type=gha,scope=selfhost-container-egress
          --cache-to type=gha,mode=max,scope=selfhost-container-egress
          --tag camelai-selfhost-container-egress:0.12.0
          workers/main/eval-egress-fix
      - name: Build self-host analysis sandbox
        run: >
          docker buildx build
          --load
          --cache-from type=gha,scope=selfhost-analysis
          --cache-to type=gha,mode=max,scope=selfhost-analysis
          --tag camelai-selfhost-analysis:0.12.0
          --file workers/main/analysis-sandbox.Dockerfile
          workers/main
      - name: Build self-host DB query sandbox
        run: >
          docker buildx build
          --load
          --cache-from type=gha,scope=selfhost-db-query
          --cache-to type=gha,mode=max,scope=selfhost-db-query
          --tag camelai-selfhost-db-query:0.12.0
          --file workers/main/db-query-sandbox.Dockerfile
          workers/main
      - name: Smoke project build runtime
        run: node scripts/selfhost-container-smoke.mjs project
      - name: Smoke analysis notebook and ZIP runtime
        run: node scripts/selfhost-container-smoke.mjs analysis
      - name: Smoke DB query drivers
        run: node scripts/selfhost-container-smoke.mjs db-query

  tests:
    # The client (jsdom) and worker (miniflare/workerd) suites share no state and
    # each is dominated by per-file environment startup, so we both split them
    # into separate jobs AND shard each suite across runners with vitest --shard.
    # vitest distributes test FILES across shards, so the per-file jsdom/workerd
    # boot cost (the bottleneck) parallelizes near-linearly: ~11min sequential ->
    # ~2-3min. Workers (~402s) gets 4 shards; client (~256s) gets 2.
    # runs-on stays a single knob: switch to a self-hosted label to move
    # execution onto a bigger box without other changes.
    name: tests (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: client, command: test:run, shard: 1, total: 2 }
          - { suite: client, command: test:run, shard: 2, total: 2 }
          - { suite: workers, command: test:workers, shard: 1, total: 4 }
          - { suite: workers, command: test:workers, shard: 2, total: 4 }
          - { suite: workers, command: test:workers, shard: 3, total: 4 }
          - { suite: workers, command: test:workers, shard: 4, total: 4 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.command }} -- --shard=${{ matrix.shard }}/${{ matrix.total }}
