name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      worker_only:
        description: Reuse the deployed container images
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect:
    name: detect container changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      worker_only: ${{ steps.check.outputs.worker_only }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check container inputs
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_WORKER_ONLY: ${{ inputs.worker_only }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: worker_only=${INPUT_WORKER_ONLY}"
            echo "worker_only=${INPUT_WORKER_ONLY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] \
            || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Previous commit '${BEFORE_SHA}' unavailable; rebuilding containers (worker_only=false)."
            echo "worker_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          container_changed="false"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              workers/main/*-container.Dockerfile|\
              workers/main/analysis-sandbox-assets/*|\
              workers/main/db-query-sandbox-assets/*|\
              workers/main/project-build-sandbox-warmup/*|\
              workers/main/project-build-sandbox-assets/*|\
              wrangler.staging.jsonc)
                echo "Container input changed: ${file}"
                container_changed="true"
                ;;
            esac
          done <<< "$changed"

          if [ "$container_changed" = "true" ]; then
            echo "Container inputs changed; running full container + worker deploy."
            echo "worker_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "No container inputs changed; reusing deployed container images (worker_only=true)."
            echo "worker_only=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
      worker_only: ${{ needs.detect.outputs.worker_only == 'true' }}
      # Until the staging environment has CLOUDFLARE_API_TOKEN, pushes to main
      # skip with a warning (Workers Builds still deploys); a manual run fails.
      skip_without_token: ${{ github.event_name == 'push' }}
    secrets: inherit
