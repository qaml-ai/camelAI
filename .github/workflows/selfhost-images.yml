name: Self-host release images

on:
  workflow_dispatch:
  push:
    tags:
      - "selfhost-v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  validate-contract:
    name: Validate self-host release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run selfhost:init
      - run: docker compose --env-file .env.selfhost -f docker-compose.selfhost.yml config --quiet
      - name: Validate bundled Pomerium overlay
        run: |
          compose() {
            docker compose --env-file .env.selfhost \
              -f docker-compose.selfhost.yml \
              -f docker-compose.selfhost.pomerium.yml \
              "$@"
          }
          cleanup() {
            exit_code=$?
            if (( exit_code != 0 )); then
              compose ps --all || true
              compose logs --tail=200 pomerium || true
            fi
            compose down --volumes || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          {
            echo "SELFHOST_TLS_MODE=external"
            echo "POMERIUM_IDP_PROVIDER_URL=https://accounts.example.com"
            echo "POMERIUM_IDP_CLIENT_ID=release-validation"
            echo "POMERIUM_IDP_CLIENT_SECRET=release-validation-secret"
          } >> .env.selfhost
          bun run selfhost:configure
          compose config --quiet
          compose up --detach pomerium
          healthy=0
          for attempt in {1..30}; do
            if compose exec -T pomerium pomerium health; then
              healthy=1
              break
            fi
            sleep 1
          done
          if (( healthy == 0 )); then
            echo "Pomerium did not become healthy within 30 seconds" >&2
            exit 1
          fi
      - run: bun run test:selfhost

  validate-bundled-images:
    name: Build ${{ matrix.image }} release image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            context: .
            dockerfile: infra/selfhost/app-bundled.Dockerfile
          - image: local-artifacts
            context: .
            dockerfile: infra/selfhost/local-artifacts.Dockerfile
          - image: caddy
            context: .
            dockerfile: infra/selfhost/caddy.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: camelai-selfhost-${{ matrix.image }}:release-validation
          cache-from: type=gha,scope=selfhost-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=selfhost-${{ matrix.image }}

      - name: Validate Caddy DNS providers
        if: matrix.image == 'caddy'
        run: |
          modules="$(docker run --rm camelai-selfhost-caddy:release-validation caddy list-modules)"
          grep -qx 'dns.providers.cloudflare' <<<"$modules"
          grep -qx 'dns.providers.route53' <<<"$modules"

      - name: Validate app image local Images dependency
        if: matrix.image == 'app'
        run: >
          docker run --rm --entrypoint node
          camelai-selfhost-app:release-validation
          --input-type=module
          --eval "await import('sharp')"

  validate-runtimes:
    name: Validate attached container runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: docker/setup-buildx-action@v3

      - run: bun install --frozen-lockfile

      - name: Build project sandbox
        run: >
          docker buildx build
          --load
          --platform linux/amd64
          --cache-from type=gha,scope=selfhost-project-build
          --cache-to type=gha,mode=max,scope=selfhost-project-build
          --tag camelai-selfhost-project-build:0.12.0
          --file workers/main/project-build-sandbox.Dockerfile
          workers/main

      - name: Build analysis sandbox
        run: >
          docker buildx build
          --load
          --platform linux/amd64
          --cache-from type=gha,scope=selfhost-analysis
          --cache-to type=gha,mode=max,scope=selfhost-analysis
          --tag camelai-selfhost-analysis:0.12.0
          --file workers/main/analysis-sandbox.Dockerfile
          workers/main

      - name: Build DB query sandbox
        run: >
          docker buildx build
          --load
          --platform linux/amd64
          --cache-from type=gha,scope=selfhost-db-query
          --cache-to type=gha,mode=max,scope=selfhost-db-query
          --tag camelai-selfhost-db-query:0.12.0
          --file workers/main/db-query-sandbox.Dockerfile
          workers/main

      - name: Build container egress interceptor
        run: >
          docker buildx build
          --load
          --platform linux/amd64
          --cache-from type=gha,scope=selfhost-container-egress
          --cache-to type=gha,mode=max,scope=selfhost-container-egress
          --tag camelai-selfhost-container-egress:0.12.0
          workers/main/eval-egress-fix

      - name: Build bundled app for nested-Docker validation
        run: >
          docker buildx build
          --load
          --platform linux/amd64
          --cache-from type=gha,scope=selfhost-app
          --cache-to type=gha,mode=max,scope=selfhost-app
          --tag camelai-selfhost-app:release-validation
          --file infra/selfhost/app-bundled.Dockerfile
          .

      - name: Smoke project build runtime
        run: node scripts/selfhost-container-smoke.mjs project

      - name: Smoke FUSE-free local R2 synchronization
        run: node scripts/selfhost-container-smoke.mjs mount

      - name: Smoke analysis notebook and ZIP runtime
        run: node scripts/selfhost-container-smoke.mjs analysis

      - name: Smoke DB query drivers
        run: node scripts/selfhost-container-smoke.mjs db-query

      - name: Smoke release app nested-Docker topology
        run: >
          docker run --rm
          --network host
          --volume /var/run/docker.sock:/var/run/docker.sock:rw
          --env SELFHOST_PROJECT_BUILD_IMAGE=camelai-selfhost-project-build:0.12.0
          --env SELFHOST_CONTAINER_EGRESS_IMAGE=camelai-selfhost-container-egress:0.12.0
          camelai-selfhost-app:release-validation
          node scripts/selfhost-container-smoke.mjs project

      - name: Smoke release app nested-Docker storage synchronization
        run: >
          docker run --rm
          --network host
          --volume /var/run/docker.sock:/var/run/docker.sock:rw
          --env SELFHOST_PROJECT_BUILD_IMAGE=camelai-selfhost-project-build:0.12.0
          --env SELFHOST_CONTAINER_EGRESS_IMAGE=camelai-selfhost-container-egress:0.12.0
          camelai-selfhost-app:release-validation
          node scripts/selfhost-container-smoke.mjs mount

  publish:
    name: Publish ${{ matrix.image }}
    needs:
      - validate-contract
      - validate-bundled-images
      - validate-runtimes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            context: .
            dockerfile: infra/selfhost/app-bundled.Dockerfile
          - image: local-artifacts
            context: .
            dockerfile: infra/selfhost/local-artifacts.Dockerfile
          - image: project-build
            context: workers/main
            dockerfile: workers/main/project-build-sandbox.Dockerfile
          - image: analysis
            context: workers/main
            dockerfile: workers/main/analysis-sandbox.Dockerfile
          - image: db-query
            context: workers/main
            dockerfile: workers/main/db-query-sandbox.Dockerfile
          - image: container-egress
            context: workers/main/eval-egress-fix
            dockerfile: workers/main/eval-egress-fix/Dockerfile
          - image: caddy
            context: .
            dockerfile: infra/selfhost/caddy.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "name=ghcr.io/${owner}/${repo}-selfhost-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/selfhost-v') }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OCI_VERSION=${{ github.ref_name }}
            OCI_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=selfhost-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=selfhost-${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  manifest:
    name: Publish release manifest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image digests
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="manual-${GITHUB_RUN_NUMBER}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          jq -n \
            --arg release "$tag" \
            --arg revision "$GITHUB_SHA" \
            '{schema: 1, release: $release, revision: $revision, images: {}}' \
            > selfhost-release.json

          for image in app local-artifacts project-build analysis db-query container-egress caddy; do
            ref="ghcr.io/${owner}/${repo}-selfhost-${image}:${tag}"
            digest=""
            for attempt in $(seq 1 12); do
              digest="$(
                docker buildx imagetools inspect "$ref" 2>/dev/null |
                  awk '/^Digest:/ { print $2; exit }' || true
              )"
              if [ -n "$digest" ]; then
                break
              fi
              echo "Waiting for ${ref} to become readable (${attempt}/12)..."
              sleep 5
            done
            test -n "$digest"
            jq \
              --arg image "$image" \
              --arg ref "${ref%@*}@${digest}" \
              '.images[$image] = $ref' \
              selfhost-release.json > selfhost-release.next.json
            mv selfhost-release.next.json selfhost-release.json
          done

          jq \
            --arg ref "pomerium/pomerium@sha256:aae6010af6ba4c864bbd3f748cf37843a140b1ddef74d7d2ac1aa87660f8da1f" \
            '.images.pomerium = $ref' \
            selfhost-release.json > selfhost-release.next.json
          mv selfhost-release.next.json selfhost-release.json

          # The bundled agent runtime, released from qaml-ai/run
          # (runtime-v* tags), at the version this checkout pins, and its
          # Postgres, pinned by digest in the same module.
          runtime_image="$(node --input-type=module -e 'const m = await import("./scripts/selfhost-agent-runtime.mjs"); console.log(m.SELFHOST_AGENT_RUNTIME_IMAGE)')"
          runtime_postgres_image="$(node --input-type=module -e 'const m = await import("./scripts/selfhost-agent-runtime.mjs"); console.log(m.SELFHOST_AGENT_RUNTIME_POSTGRES_IMAGE)')"
          runtime_digest="$(
            docker buildx imagetools inspect "$runtime_image" |
              awk '/^Digest:/ { print $2; exit }'
          )"
          test -n "$runtime_digest"
          jq \
            --arg runtime "${runtime_image%:*}@${runtime_digest}" \
            --arg postgres "$runtime_postgres_image" \
            '.images["agent-runtime"] = $runtime | .images["agent-runtime-postgres"] = $postgres' \
            selfhost-release.json > selfhost-release.next.json
          mv selfhost-release.next.json selfhost-release.json

          jq --sort-keys . selfhost-release.json

      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-release-manifest-${{ github.run_id }}
          path: |
            selfhost-release.json
            scripts/selfhost-upgrade-bootstrap.mjs
          if-no-files-found: error

      - name: Publish durable GitHub release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/selfhost-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Immutable self-host image manifest and verified upgrade bootstrap."
          fi
          gh release upload "$GITHUB_REF_NAME" \
            selfhost-release.json \
            scripts/selfhost-upgrade-bootstrap.mjs \
            --clobber
