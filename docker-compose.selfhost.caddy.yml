services:
  app:
    depends_on:
      caddy:
        condition: service_healthy

  caddy:
    image: ${SELFHOST_CADDY_IMAGE:?Set SELFHOST_CADDY_IMAGE to the immutable camelAI Caddy image}
    network_mode: host
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE", "NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    environment:
      AWS_REGION: ${SELFHOST_TLS_AWS_REGION:-us-east-1}
      AWS_PROFILE: ${SELFHOST_TLS_AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /run/camelai-secrets/aws-credentials
    volumes:
      - ./.selfhost/caddy:/etc/caddy:ro
      - ./.selfhost/caddy/secrets:/run/camelai-secrets:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # The admin API listens only on this 0600 unix socket (no TCP port).
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--unix-socket", "/config/caddy-admin.sock", "http://localhost/config/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  caddy-data:
  caddy-config:
