services:
  app:
    image: ${SELFHOST_APP_IMAGE:?Set SELFHOST_APP_IMAGE to an immutable camelAI self-host image}
    # workerd's localDocker engine assigns loopback addresses to its sandbox
    # sidecars. It therefore has to share the Linux VM network namespace rather
    # than run behind a second Docker bridge.
    network_mode: host
    environment:
      NODE_ENV: production
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?Run bun run selfhost:init}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:?Run bun run selfhost:init}
      WORKER_BASE_URL: ${SELFHOST_PUBLIC_BASE_URL:?Run bun run selfhost:init}
      LOCAL_ARTIFACTS_BASE_URL: http://127.0.0.1:7001
      LOCAL_ARTIFACTS_SECRET: ${LOCAL_ARTIFACTS_SECRET:?Run bun run selfhost:init}
      CF_ACCOUNT_ID: selfhost
      CF_DISPATCH_NAMESPACE: selfhost
      CF_WORKER_NAME: chiridion-selfhost
      AI_VIRTUAL_MODEL: dynamic/auto
      SELFHOST_AI_PROVIDER: ${SELFHOST_AI_PROVIDER:-}
      SELFHOST_AI_API_KEY: ${SELFHOST_AI_API_KEY:-}
      SELFHOST_AI_BASE_URL: ${SELFHOST_AI_BASE_URL:-}
      SELFHOST_AI_MODEL: ${SELFHOST_AI_MODEL:-}
      SELFHOST_AI_NAME: ${SELFHOST_AI_NAME:-}
      SELFHOST_AI_AUTH_TYPE: ${SELFHOST_AI_AUTH_TYPE:-bearer}
      SELFHOST_AI_API: ${SELFHOST_AI_API:-openai-completions}
      SELFHOST_AI_AWS_REGION: ${SELFHOST_AI_AWS_REGION:-us-east-1}
      SELFHOST_AGENT_DIR: ${SELFHOST_AGENT_DIR:-.selfhost/agent}
      SELFHOST_AGENT_SKILLS_DIR: ${SELFHOST_AGENT_SKILLS_DIR:-}
      SELFHOST_AGENT_PROMPT_APPEND: ${SELFHOST_AGENT_PROMPT_APPEND:-}
      SELFHOST_AGENT_PROMPT_PREPEND: ${SELFHOST_AGENT_PROMPT_PREPEND:-}
      SELFHOST_AGENT_SKILLS_JSON: ${SELFHOST_AGENT_SKILLS_JSON:-}
      LOCAL_AUTH_BYPASS: ${LOCAL_AUTH_BYPASS:-}
      LOCAL_AUTH_BYPASS_HOSTS: ${LOCAL_AUTH_BYPASS_HOSTS:-}
      LOCAL_AUTH_USER_EMAIL: ${LOCAL_AUTH_USER_EMAIL:-}
      LOCAL_AUTH_USER_NAME: ${LOCAL_AUTH_USER_NAME:-}
      SELFHOST_WORKERD_SOCKET: ${SELFHOST_BIND_ADDRESS:-127.0.0.1}:${SELFHOST_APP_PORT:-3001}
      EMAIL_FROM_ADDRESS: no-reply@localhost
      WORKSPACE_EMAIL_DOMAIN: localhost
      LOCAL_APP_VANITY_DOMAIN: ${LOCAL_APP_VANITY_DOMAIN:-}
      LOCAL_APP_IFRAME_DOMAIN: ${LOCAL_APP_IFRAME_DOMAIN:-}
      SELFHOST_BROWSER_NO_SANDBOX: ${SELFHOST_BROWSER_NO_SANDBOX:-1}
      SELFHOST_DOCKER_SOCKET_URI: unix:///var/run/docker.sock
      SELFHOST_PROJECT_BUILD_IMAGE: ${SELFHOST_PROJECT_BUILD_IMAGE:?Set SELFHOST_PROJECT_BUILD_IMAGE to an immutable sandbox image}
      SELFHOST_ANALYSIS_IMAGE: ${SELFHOST_ANALYSIS_IMAGE:?Set SELFHOST_ANALYSIS_IMAGE to an immutable sandbox image}
      SELFHOST_DB_QUERY_IMAGE: ${SELFHOST_DB_QUERY_IMAGE:?Set SELFHOST_DB_QUERY_IMAGE to an immutable sandbox image}
      SELFHOST_CONTAINER_EGRESS_IMAGE: ${SELFHOST_CONTAINER_EGRESS_IMAGE:?Set SELFHOST_CONTAINER_EGRESS_IMAGE to the immutable camelAI egress image}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      CLOUDFLARE_ACCESS_AUDS: ${CLOUDFLARE_ACCESS_AUDS:-}
      CLOUDFLARE_ACCESS_ORG_MAP: ${CLOUDFLARE_ACCESS_ORG_MAP:-}
      CLOUDFLARE_ACCESS_ORG_CLAIMS: ${CLOUDFLARE_ACCESS_ORG_CLAIMS:-}
      CLOUDFLARE_ACCESS_ORG_GROUP_PREFIX: ${CLOUDFLARE_ACCESS_ORG_GROUP_PREFIX:-}
      CLOUDFLARE_ACCESS_ADMIN_GROUP_PREFIX: ${CLOUDFLARE_ACCESS_ADMIN_GROUP_PREFIX:-}
      CLOUDFLARE_ACCESS_DEFAULT_ORG_NAME: ${CLOUDFLARE_ACCESS_DEFAULT_ORG_NAME:-}
      CLOUDFLARE_ACCESS_REQUIRED_EMAIL_DOMAIN: ${CLOUDFLARE_ACCESS_REQUIRED_EMAIL_DOMAIN:-}
      POMERIUM_JWKS_URL: ${POMERIUM_JWKS_URL:-}
      POMERIUM_AUTHENTICATE_URL: ${POMERIUM_AUTHENTICATE_URL:-}
      POMERIUM_ISSUER: ${POMERIUM_ISSUER:-}
      POMERIUM_AUDIENCE: ${POMERIUM_AUDIENCE:-}
      POMERIUM_ORG_MAP: ${POMERIUM_ORG_MAP:-}
      POMERIUM_ORG_CLAIMS: ${POMERIUM_ORG_CLAIMS:-}
      POMERIUM_ORG_GROUP_PREFIX: ${POMERIUM_ORG_GROUP_PREFIX:-}
      POMERIUM_ADMIN_GROUP_PREFIX: ${POMERIUM_ADMIN_GROUP_PREFIX:-}
      POMERIUM_DEFAULT_ORG_NAME: ${POMERIUM_DEFAULT_ORG_NAME:-}
      POMERIUM_REQUIRED_EMAIL_DOMAIN: ${POMERIUM_REQUIRED_EMAIL_DOMAIN:-}
    volumes:
      - app-state:/workspace/.selfhost/workerd/state
      # Operator agent customization pack (skills + prompt append/prepend).
      # Read at workerd-config generation on container start.
      - ${SELFHOST_AGENT_HOST_DIR:-./.selfhost/agent}:/workspace/.selfhost/agent:ro
      # Attached workerd containers require read-write Docker API access.
      # Treat control of this container as root-equivalent access to the VM.
      - ${SELFHOST_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:rw
    depends_on:
      local-artifacts:
        condition: service_healthy
      project-build-image:
        condition: service_completed_successfully
      analysis-image:
        condition: service_completed_successfully
      db-query-image:
        condition: service_completed_successfully
      container-egress-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${SELFHOST_APP_PORT:-3001}/api/selfhost/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  # These one-shot services make the exact image names referenced by workerd
  # available in the VM's Docker daemon before the app starts.
  project-build-image:
    image: ${SELFHOST_PROJECT_BUILD_IMAGE:?Set SELFHOST_PROJECT_BUILD_IMAGE to an immutable sandbox image}
    entrypoint: ["/bin/true"]
    restart: "no"

  analysis-image:
    image: ${SELFHOST_ANALYSIS_IMAGE:?Set SELFHOST_ANALYSIS_IMAGE to an immutable sandbox image}
    entrypoint: ["/bin/true"]
    restart: "no"

  db-query-image:
    image: ${SELFHOST_DB_QUERY_IMAGE:?Set SELFHOST_DB_QUERY_IMAGE to an immutable sandbox image}
    entrypoint: ["/bin/true"]
    restart: "no"

  container-egress-image:
    image: ${SELFHOST_CONTAINER_EGRESS_IMAGE:?Set SELFHOST_CONTAINER_EGRESS_IMAGE to the immutable camelAI egress image}
    entrypoint: ["/bin/true"]
    restart: "no"

  local-artifacts:
    image: ${SELFHOST_LOCAL_ARTIFACTS_IMAGE:?Set SELFHOST_LOCAL_ARTIFACTS_IMAGE to an immutable local-artifacts image}
    environment:
      LOCAL_ARTIFACTS_PORT: "7001"
      LOCAL_ARTIFACTS_REPO_ROOT: /data/repos
      LOCAL_ARTIFACTS_PUBLIC_BASE_URL: http://127.0.0.1:7001
      LOCAL_ARTIFACTS_SECRET: ${LOCAL_ARTIFACTS_SECRET:?Run bun run selfhost:init}
    ports:
      - "${SELFHOST_BIND_ADDRESS:-127.0.0.1}:7001:7001"
    volumes:
      - local-artifacts-repos:/data/repos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-state:
  local-artifacts-repos:
