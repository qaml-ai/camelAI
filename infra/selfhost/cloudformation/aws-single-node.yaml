AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  camelAI supported single-node self-host release on Ubuntu, Docker Compose,
  encrypted EBS, SSM, Secrets Manager, and Caddy. The seven runtime images are
  prebuilt release artifacts; this stack does not build application images.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network and compute
        Parameters:
          - Name
          - VpcId
          - SubnetId
          - AvailabilityZone
          - UbuntuAmiId
          - InstanceType
          - RootVolumeSizeGiB
          - DataVolumeSizeGiB
          - EbsKmsKeyId
          - WebIngressCidr
          - SshIngressCidr
          - KeyName
      - Label:
          default: Versioned release
        Parameters:
          - RepositoryUrl
          - RepositoryRef
          - AppImage
          - LocalArtifactsImage
          - ProjectBuildImage
          - AnalysisImage
          - DbQueryImage
          - ContainerEgressImage
          - CaddyImage
      - Label:
          default: Hostnames, TLS, and DNS
        Parameters:
          - MainHostname
          - AppVanityDomain
          - AppIframeDomain
          - TlsMode
          - TlsCertificateSecretArn
          - TlsPrivateKeySecretArn
          - CreateRoute53Records
          - Route53HostedZoneId
      - Label:
          default: Identity-aware proxy
        Parameters:
          - AuthProvider
          - AuthDefaultOrgName
          - CloudflareAccessTeamDomain
          - CloudflareAccessAudience
          - PomeriumAuthenticateUrl
          - PomeriumAuthenticateHostname
          - PomeriumJwksUrl
          - PomeriumIssuer
          - PomeriumAudience
          - PomeriumImage
          - PomeriumIdpProvider
          - PomeriumIdpProviderUrl
          - PomeriumIdpClientId
          - PomeriumIdpClientSecretArn
      - Label:
          default: AI provider
        Parameters:
          - SelfhostAiProvider
          - SelfhostAiApiKeySecretArn
          - SelfhostAiAwsRegion
          - SelfhostAiBaseUrl
          - SelfhostAiModel
          - SelfhostAiName
          - SelfhostAiApi
          - SelfhostAiAuthType

Parameters:
  Name:
    Type: String
    Default: camelai-selfhost
    AllowedPattern: "[A-Za-z0-9-]+"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone containing SubnetId.
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  InstanceType:
    Type: String
    Default: t3a.xlarge
    AllowedValues:
      - t3a.xlarge
      - t3.xlarge
      - m6a.xlarge
      - m6i.xlarge
      - m7a.xlarge
      - m7i.xlarge
  RootVolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 20
  DataVolumeSizeGiB:
    Type: Number
    Default: 100
    MinValue: 50
  EbsKmsKeyId:
    Type: String
    Default: ""
    Description: Optional KMS key ARN/id. Blank uses the AWS-managed EBS key.
  WebIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}"
  SshIngressCidr:
    Type: String
    Default: ""
    Description: Optional SSH CIDR. Prefer SSM Session Manager and leave blank.
  KeyName:
    Type: String
    Default: ""
    Description: Optional existing EC2 key pair name.

  RepositoryUrl:
    Type: String
    Default: https://github.com/qaml-ai/camelAI.git
    AllowedPattern: "https://[^\\s']+"
  RepositoryRef:
    Type: String
    Description: Pinned camelAI release tag or full commit SHA.
    AllowedPattern: "[A-Za-z0-9._/-]+"
  AppImage:
    Type: String
    Description: Immutable camelai-selfhost-app tag or digest.
    AllowedPattern: "(?!.*:latest$)[A-Za-z0-9._/@:-]+"
  LocalArtifactsImage:
    Type: String
    Description: Immutable camelai-selfhost-local-artifacts tag or digest.
    AllowedPattern: "(?!.*:latest$)[A-Za-z0-9._/@:-]+"
  ProjectBuildImage:
    Type: String
    Description: Immutable camelai-selfhost-project-build tag or digest.
    AllowedPattern: "(?!.*:latest$)[A-Za-z0-9._/@:-]+"
  AnalysisImage:
    Type: String
    Description: Immutable camelai-selfhost-analysis tag or digest.
    AllowedPattern: "(?!.*:latest$)[A-Za-z0-9._/@:-]+"
  DbQueryImage:
    Type: String
    Description: Immutable camelai-selfhost-db-query tag or digest.
    AllowedPattern: "(?!.*:latest$)[A-Za-z0-9._/@:-]+"
  ContainerEgressImage:
    Type: String
    Description: Immutable camelai-selfhost-container-egress tag or digest.
    AllowedPattern: "(?!.*:latest$)[A-Za-z0-9._/@:-]+"
  CaddyImage:
    Type: String
    Description: Immutable camelai-selfhost-caddy tag or digest.
    AllowedPattern: "(?!.*:latest$)[A-Za-z0-9._/@:-]+"

  MainHostname:
    Type: String
    Description: camelAI hostname without a scheme, for example camel.example.com.
    AllowedPattern: "[A-Za-z0-9.-]+"
  AppVanityDomain:
    Type: String
    Description: Wildcard app domain root without '*.', for example apps.example.com.
    AllowedPattern: "[A-Za-z0-9.-]+"
  AppIframeDomain:
    Type: String
    Default: ""
    Description: Optional separate iframe domain root; blank uses AppVanityDomain.
    AllowedPattern: "[A-Za-z0-9.-]*"
  TlsMode:
    Type: String
    Default: automatic
    AllowedValues:
      - automatic
      - provided
      - external
    Description: >-
      automatic obtains wildcard certificates through Route 53 DNS validation;
      provided installs PEM secrets on Caddy; external exposes an HTTP origin
      intended only for a trusted TLS-terminating upstream proxy.
  TlsCertificateSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN containing the PEM certificate chain.
    AllowedPattern: "(|arn:[A-Za-z0-9-]+:secretsmanager:[A-Za-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+)"
  TlsPrivateKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN containing the PEM private key.
    AllowedPattern: "(|arn:[A-Za-z0-9-]+:secretsmanager:[A-Za-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+)"
  CreateRoute53Records:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  Route53HostedZoneId:
    Type: String
    Default: ""

  AuthProvider:
    Type: String
    Default: bundled-pomerium
    AllowedValues:
      - cloudflare-access
      - pomerium
      - bundled-pomerium
    Description: Public installs require an identity-aware proxy.
  AuthDefaultOrgName:
    Type: String
    AllowedPattern: "[A-Za-z0-9 ._-]+"
  CloudflareAccessTeamDomain:
    Type: String
    Default: ""
    AllowedPattern: "(|https://[^\\s']+)"
  CloudflareAccessAudience:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9._-]*"
  PomeriumAuthenticateUrl:
    Type: String
    Default: ""
    AllowedPattern: "(|https://[^\\s']+)"
  PomeriumAuthenticateHostname:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9.-]*"
  PomeriumImage:
    Type: String
    Default: pomerium/pomerium@sha256:aae6010af6ba4c864bbd3f748cf37843a140b1ddef74d7d2ac1aa87660f8da1f
    AllowedPattern: "[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}"
  PomeriumIdpProvider:
    Type: String
    Default: oidc
    AllowedPattern: "[A-Za-z0-9._-]+"
  PomeriumIdpProviderUrl:
    Type: String
    Default: ""
    AllowedPattern: "(|https://[^\\s']+)"
  PomeriumIdpClientId:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9._:/-]*"
  PomeriumIdpClientSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "(|arn:[A-Za-z0-9-]+:secretsmanager:[A-Za-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+)"
  PomeriumJwksUrl:
    Type: String
    Default: ""
    AllowedPattern: "(|https://[^\\s']+)"
  PomeriumIssuer:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9._:/-]*"
  PomeriumAudience:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9._:/-]*"

  SelfhostAiProvider:
    Type: String
    Default: bedrock
    AllowedValues:
      - bedrock
      - anthropic
      - openai
      - openrouter
      - custom
  SelfhostAiApiKeySecretArn:
    Type: String
    Description: >-
      Secrets Manager ARN whose SecretString is the provider API key. Bedrock
      uses its long-term API key through the Mantle compatibility endpoint;
      EC2 instance-profile SigV4 is not used by this release.
    AllowedPattern: "arn:[A-Za-z0-9-]+:secretsmanager:[A-Za-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+"
  SelfhostAiAwsRegion:
    Type: String
    Default: us-east-1
    AllowedPattern: "[a-z]{2}-[a-z]+-[0-9]"
  SelfhostAiBaseUrl:
    Type: String
    Default: ""
    AllowedPattern: "(|https://[^\\s']+)"
  SelfhostAiModel:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9._:/-]*"
  SelfhostAiName:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9 ._:/-]*"
  SelfhostAiApi:
    Type: String
    Default: openai-completions
    AllowedValues:
      - openai-completions
      - openai-responses
      - anthropic-messages
  SelfhostAiAuthType:
    Type: String
    Default: bearer
    AllowedValues:
      - bearer
      - x-api-key

Rules:
  ProvidedTlsRequiresSecrets:
    RuleCondition: !Equals [!Ref TlsMode, provided]
    Assertions:
      - Assert: !Not [!Equals [!Ref TlsCertificateSecretArn, ""]]
        AssertDescription: TlsCertificateSecretArn is required for provided TLS.
      - Assert: !Not [!Equals [!Ref TlsPrivateKeySecretArn, ""]]
        AssertDescription: TlsPrivateKeySecretArn is required for provided TLS.
  Route53RequiresZone:
    RuleCondition: !Or
      - !Equals [!Ref CreateRoute53Records, "true"]
      - !Equals [!Ref TlsMode, automatic]
    Assertions:
      - Assert: !Not [!Equals [!Ref Route53HostedZoneId, ""]]
        AssertDescription: Route53HostedZoneId is required for automatic TLS or when creating records.
  LocalTlsRequiresBundledPomerium:
    RuleCondition: !Not [!Equals [!Ref TlsMode, external]]
    Assertions:
      - Assert: !Equals [!Ref AuthProvider, bundled-pomerium]
        AssertDescription: automatic and provided TLS require bundled-pomerium authentication.
  CloudflareAccessRequiresSettings:
    RuleCondition: !Equals [!Ref AuthProvider, cloudflare-access]
    Assertions:
      - Assert: !Not [!Equals [!Ref CloudflareAccessTeamDomain, ""]]
        AssertDescription: CloudflareAccessTeamDomain is required.
      - Assert: !Not [!Equals [!Ref CloudflareAccessAudience, ""]]
        AssertDescription: CloudflareAccessAudience is required.
  PomeriumRequiresSettings:
    RuleCondition: !Equals [!Ref AuthProvider, pomerium]
    Assertions:
      - Assert: !Not [!Equals [!Ref PomeriumAuthenticateUrl, ""]]
        AssertDescription: PomeriumAuthenticateUrl is required.
      - Assert: !Not [!Equals [!Ref PomeriumIssuer, ""]]
        AssertDescription: PomeriumIssuer is required.
      - Assert: !Not [!Equals [!Ref PomeriumAudience, ""]]
        AssertDescription: PomeriumAudience is required.
  BundledPomeriumRequiresSettings:
    RuleCondition: !Equals [!Ref AuthProvider, bundled-pomerium]
    Assertions:
      - Assert: !Not [!Equals [!Ref PomeriumAuthenticateUrl, ""]]
        AssertDescription: PomeriumAuthenticateUrl is required.
      - Assert: !Not [!Equals [!Ref PomeriumAuthenticateHostname, ""]]
        AssertDescription: PomeriumAuthenticateHostname is required.
      - Assert: !Or
          - !Not [!Equals [!Ref PomeriumIdpProvider, oidc]]
          - !Not [!Equals [!Ref PomeriumIdpProviderUrl, ""]]
        AssertDescription: PomeriumIdpProviderUrl is required for generic OIDC.
      - Assert: !Not [!Equals [!Ref PomeriumIdpClientId, ""]]
        AssertDescription: PomeriumIdpClientId is required.
      - Assert: !Not [!Equals [!Ref PomeriumIdpClientSecretArn, ""]]
        AssertDescription: PomeriumIdpClientSecretArn is required.

Conditions:
  HasKmsKey: !Not [!Equals [!Ref EbsKmsKeyId, ""]]
  HasSshCidr: !Not [!Equals [!Ref SshIngressCidr, ""]]
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasSeparateIframeDomain: !Not [!Equals [!Ref AppIframeDomain, ""]]
  IsAutomaticTls: !Equals [!Ref TlsMode, automatic]
  IsProvidedTls: !Equals [!Ref TlsMode, provided]
  IsLocalTls: !Or
    - !Condition IsAutomaticTls
    - !Condition IsProvidedTls
  IsBundledPomerium: !Equals [!Ref AuthProvider, bundled-pomerium]
  CreateBundledPomeriumDns: !And
    - !Condition CreateDns
    - !Condition IsBundledPomerium
  CreateDns: !Equals [!Ref CreateRoute53Records, "true"]
  CreateSeparateIframeDns: !And
    - !Condition CreateDns
    - !Condition HasSeparateIframeDomain

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: camelAI self-host ingress
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref WebIngressCidr
        - !If
          - IsLocalTls
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref WebIngressCidr
          - !Ref AWS::NoValue
        - !If
          - HasSshCidr
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref SshIngressCidr
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub ${Name}-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadCamelAiBootstrapSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SelfhostAiApiKeySecretArn
              - !If
                - IsBundledPomerium
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub "${PomeriumIdpClientSecretArn}*"
                - !Ref AWS::NoValue
              - !If
                - IsProvidedTls
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                    - !Sub "${TlsCertificateSecretArn}*"
                    - !Sub "${TlsPrivateKeySecretArn}*"
                - !Ref AWS::NoValue
              - !If
                - IsAutomaticTls
                - Effect: Allow
                  Action:
                    - route53:ListHostedZones
                    - route53:ListHostedZonesByName
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IsAutomaticTls
                - Effect: Allow
                  Action: route53:ListResourceRecordSets
                  Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${Route53HostedZoneId}"
                - !Ref AWS::NoValue
              - !If
                - IsAutomaticTls
                - Effect: Allow
                  Action: route53:GetChange
                  Resource: !Sub "arn:${AWS::Partition}:route53:::change/*"
                - !Ref AWS::NoValue
              - !If
                - IsAutomaticTls
                - Effect: Allow
                  Action: route53:ChangeResourceRecordSets
                  Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${Route53HostedZoneId}"
                  Condition:
                    ForAllValues:StringEquals:
                      route53:ChangeResourceRecordSetsRecordTypes: TXT
                    ForAllValues:StringLike:
                      route53:ChangeResourceRecordSetsNormalizedRecordNames: "_acme-challenge.*"
                - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub ${Name}-role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      KmsKeyId: !If [HasKmsKey, !Ref EbsKmsKeyId, !Ref AWS::NoValue]
      Size: !Ref DataVolumeSizeGiB
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${Name}-data

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref SecurityGroup
      SubnetId: !Ref SubnetId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            KmsKeyId: !If [HasKmsKey, !Ref EbsKmsKeyId, !Ref AWS::NoValue]
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Ref Name
      UserData:
        Fn::Base64:
          Fn::Join:
            - ""
            - - |
                #!/usr/bin/env bash
                set -Eeuo pipefail
                export DEBIAN_FRONTEND=noninteractive
                SIGNAL_URL='
              - !Ref BootstrapWaitHandle
              - |
                '
                signal() {
                  local status=$1
                  curl --fail --silent --show-error -X PUT -H 'Content-Type:' \
                    --data-binary "{\"Status\":\"$status\",\"UniqueId\":\"$(hostname)\",\"Data\":\"camelAI bootstrap $status\"}" \
                    "$SIGNAL_URL"
                }
                trap 'signal FAILURE' ERR
                DATA_VOLUME_ID='
              - !Ref DataVolume
              - |
                '
                REPOSITORY_URL='
              - !Ref RepositoryUrl
              - "'\nREPOSITORY_REF='"
              - !Ref RepositoryRef
              - "'\nAPP_IMAGE='"
              - !Ref AppImage
              - "'\nLOCAL_ARTIFACTS_IMAGE='"
              - !Ref LocalArtifactsImage
              - "'\nPROJECT_BUILD_IMAGE='"
              - !Ref ProjectBuildImage
              - "'\nANALYSIS_IMAGE='"
              - !Ref AnalysisImage
              - "'\nDB_QUERY_IMAGE='"
              - !Ref DbQueryImage
              - "'\nCONTAINER_EGRESS_IMAGE='"
              - !Ref ContainerEgressImage
              - "'\nCADDY_IMAGE='"
              - !Ref CaddyImage
              - "'\nAWS_REGION='"
              - !Ref AWS::Region
              - "'\nMAIN_HOSTNAME='"
              - !Ref MainHostname
              - "'\nAPP_VANITY_DOMAIN='"
              - !Ref AppVanityDomain
              - "'\nAPP_IFRAME_DOMAIN='"
              - !If [HasSeparateIframeDomain, !Ref AppIframeDomain, !Ref AppVanityDomain]
              - "'\nTLS_MODE='"
              - !Ref TlsMode
              - "'\nTLS_CERTIFICATE_SECRET_ARN='"
              - !Ref TlsCertificateSecretArn
              - "'\nTLS_PRIVATE_KEY_SECRET_ARN='"
              - !Ref TlsPrivateKeySecretArn
              - "'\nROUTE53_ZONE_ID='"
              - !Ref Route53HostedZoneId
              - "'\nAUTH_PROVIDER='"
              - !Ref AuthProvider
              - "'\nAUTH_DEFAULT_ORG_NAME='"
              - !Ref AuthDefaultOrgName
              - "'\nCLOUDFLARE_ACCESS_TEAM_DOMAIN='"
              - !Ref CloudflareAccessTeamDomain
              - "'\nCLOUDFLARE_ACCESS_AUD='"
              - !Ref CloudflareAccessAudience
              - "'\nPOMERIUM_AUTHENTICATE_URL='"
              - !Ref PomeriumAuthenticateUrl
              - "'\nPOMERIUM_AUTHENTICATE_HOSTNAME='"
              - !Ref PomeriumAuthenticateHostname
              - "'\nPOMERIUM_IMAGE='"
              - !Ref PomeriumImage
              - "'\nPOMERIUM_IDP_PROVIDER='"
              - !Ref PomeriumIdpProvider
              - "'\nPOMERIUM_IDP_PROVIDER_URL='"
              - !Ref PomeriumIdpProviderUrl
              - "'\nPOMERIUM_IDP_CLIENT_ID='"
              - !Ref PomeriumIdpClientId
              - "'\nPOMERIUM_IDP_CLIENT_SECRET_ARN='"
              - !Ref PomeriumIdpClientSecretArn
              - "'\nPOMERIUM_JWKS_URL='"
              - !Ref PomeriumJwksUrl
              - "'\nPOMERIUM_ISSUER='"
              - !Ref PomeriumIssuer
              - "'\nPOMERIUM_AUDIENCE='"
              - !Ref PomeriumAudience
              - "'\nSELFHOST_AI_PROVIDER='"
              - !Ref SelfhostAiProvider
              - "'\nSELFHOST_AI_API_KEY_SECRET_ARN='"
              - !Ref SelfhostAiApiKeySecretArn
              - "'\nSELFHOST_AI_AWS_REGION='"
              - !Ref SelfhostAiAwsRegion
              - "'\nSELFHOST_AI_BASE_URL='"
              - !Ref SelfhostAiBaseUrl
              - "'\nSELFHOST_AI_MODEL='"
              - !Ref SelfhostAiModel
              - "'\nSELFHOST_AI_NAME='"
              - !Ref SelfhostAiName
              - "'\nSELFHOST_AI_API='"
              - !Ref SelfhostAiApi
              - "'\nSELFHOST_AI_AUTH_TYPE='"
              - !Ref SelfhostAiAuthType
              - |
                '

                apt-get update
                apt-get install -y ca-certificates curl git jq awscli xfsprogs
                install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
                chmod a+r /etc/apt/keyrings/docker.asc
                . /etc/os-release
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
                curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
                apt-get update
                apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin nodejs
                npm install --global bun@1.3.14
                systemctl enable --now docker
                if systemctl list-unit-files amazon-ssm-agent.service --no-legend | grep -q amazon-ssm-agent; then
                  systemctl enable --now amazon-ssm-agent
                elif systemctl list-unit-files snap.amazon-ssm-agent.amazon-ssm-agent.service --no-legend | grep -q amazon-ssm-agent; then
                  systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent
                fi

                serial=${DATA_VOLUME_ID//-/}
                device=""
                for attempt in $(seq 1 120); do
                  for candidate in "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$serial" /dev/xvdf /dev/sdf; do
                    if [ -b "$candidate" ]; then device=$(readlink -f "$candidate"); break 2; fi
                  done
                  device=$(lsblk -ndo PATH,SERIAL | awk -v serial="$serial" '$2 == serial { print $1; exit }')
                  [ -n "$device" ] && break
                  sleep 5
                done
                [ -b "$device" ] || { echo "Persistent EBS volume did not attach" >&2; exit 1; }
                if ! blkid "$device" >/dev/null 2>&1; then mkfs.ext4 -L camelai-data "$device"; fi
                mkdir -p /srv/camelai
                uuid=$(blkid -s UUID -o value "$device")
                grep -q "UUID=$uuid" /etc/fstab || echo "UUID=$uuid /srv/camelai ext4 defaults,nofail 0 2" >> /etc/fstab
                mount /srv/camelai
                mkdir -p /srv/camelai/docker /srv/camelai/backups
                printf '{"data-root":"/srv/camelai/docker"}\n' > /etc/docker/daemon.json
                systemctl restart docker

                if [ ! -d /srv/camelai/repo/.git ]; then git clone "$REPOSITORY_URL" /srv/camelai/repo; fi
                cd /srv/camelai/repo
                git remote set-url origin "$REPOSITORY_URL"
                git fetch --tags --force origin
                git checkout --detach "$REPOSITORY_REF"
                bun install --frozen-lockfile
                [ -f .env.selfhost ] || bun run selfhost:init

                SELFHOST_AI_API_KEY=$(aws secretsmanager get-secret-value --secret-id "$SELFHOST_AI_API_KEY_SECRET_ARN" --query SecretString --output text)
                [ -n "$SELFHOST_AI_API_KEY" ] && [ "$SELFHOST_AI_API_KEY" != None ]
                [[ "$SELFHOST_AI_API_KEY" != *$'\n'* ]] || { echo "AI API key secret must be one line" >&2; exit 1; }

                POMERIUM_IDP_CLIENT_SECRET=""
                if [ "$AUTH_PROVIDER" = bundled-pomerium ]; then
                  POMERIUM_IDP_CLIENT_SECRET=$(aws secretsmanager get-secret-value --secret-id "$POMERIUM_IDP_CLIENT_SECRET_ARN" --query SecretString --output text)
                  [ -n "$POMERIUM_IDP_CLIENT_SECRET" ] && [ "$POMERIUM_IDP_CLIENT_SECRET" != None ]
                  [[ "$POMERIUM_IDP_CLIENT_SECRET" != *$'\n'* ]] || { echo "Pomerium IdP client secret must be one line" >&2; exit 1; }
                fi

                export APP_IMAGE LOCAL_ARTIFACTS_IMAGE PROJECT_BUILD_IMAGE ANALYSIS_IMAGE DB_QUERY_IMAGE CONTAINER_EGRESS_IMAGE CADDY_IMAGE
                export AWS_REGION ROUTE53_ZONE_ID TLS_MODE
                export MAIN_HOSTNAME APP_VANITY_DOMAIN APP_IFRAME_DOMAIN SELFHOST_AI_PROVIDER SELFHOST_AI_API_KEY
                export SELFHOST_AI_AWS_REGION SELFHOST_AI_BASE_URL SELFHOST_AI_MODEL SELFHOST_AI_NAME SELFHOST_AI_API SELFHOST_AI_AUTH_TYPE
                export AUTH_PROVIDER AUTH_DEFAULT_ORG_NAME CLOUDFLARE_ACCESS_TEAM_DOMAIN CLOUDFLARE_ACCESS_AUD
                export POMERIUM_AUTHENTICATE_URL POMERIUM_AUTHENTICATE_HOSTNAME POMERIUM_JWKS_URL POMERIUM_ISSUER POMERIUM_AUDIENCE
                export POMERIUM_IMAGE POMERIUM_IDP_PROVIDER POMERIUM_IDP_PROVIDER_URL POMERIUM_IDP_CLIENT_ID POMERIUM_IDP_CLIENT_SECRET
                node <<'NODE'
                import fs from "node:fs";
                const e = process.env;
                const updates = {
                  SELFHOST_DEPLOYMENT_MODE: "release",
                  SELFHOST_APP_IMAGE: e.APP_IMAGE,
                  SELFHOST_LOCAL_ARTIFACTS_IMAGE: e.LOCAL_ARTIFACTS_IMAGE,
                  SELFHOST_PROJECT_BUILD_IMAGE: e.PROJECT_BUILD_IMAGE,
                  SELFHOST_ANALYSIS_IMAGE: e.ANALYSIS_IMAGE,
                  SELFHOST_DB_QUERY_IMAGE: e.DB_QUERY_IMAGE,
                  SELFHOST_CONTAINER_EGRESS_IMAGE: e.CONTAINER_EGRESS_IMAGE,
                  SELFHOST_CADDY_IMAGE: e.CADDY_IMAGE,
                  SELFHOST_PUBLIC_BASE_URL: `https://${e.MAIN_HOSTNAME}`,
                  SELFHOST_MAIN_HOSTNAME: e.MAIN_HOSTNAME,
                  SELFHOST_AUTH_MODE: e.AUTH_PROVIDER === "pomerium" ? "external-pomerium" : e.AUTH_PROVIDER,
                  SELFHOST_TLS_MODE: e.TLS_MODE,
                  SELFHOST_TLS_DNS_PROVIDER: e.TLS_MODE === "automatic" ? "route53" : "",
                  SELFHOST_TLS_ROUTE53_HOSTED_ZONE_ID: e.TLS_MODE === "automatic" ? e.ROUTE53_ZONE_ID : "",
                  SELFHOST_TLS_AWS_REGION: e.AWS_REGION,
                  SELFHOST_TLS_EXTERNAL_BIND_ADDRESS: e.TLS_MODE === "external" ? "0.0.0.0" : "127.0.0.1",
                  SELFHOST_TLS_EXTERNAL_PORT: e.TLS_MODE === "external" ? "80" : "8080",
                  SELFHOST_POMERIUM_IMAGE: e.POMERIUM_IMAGE,
                  LOCAL_APP_VANITY_DOMAIN: e.APP_VANITY_DOMAIN,
                  LOCAL_APP_IFRAME_DOMAIN: e.APP_IFRAME_DOMAIN,
                  SELFHOST_AI_PROVIDER: e.SELFHOST_AI_PROVIDER,
                  SELFHOST_AI_API_KEY: e.SELFHOST_AI_API_KEY,
                  SELFHOST_AI_AWS_REGION: e.SELFHOST_AI_AWS_REGION,
                  SELFHOST_AI_BASE_URL: e.SELFHOST_AI_BASE_URL,
                  SELFHOST_AI_MODEL: e.SELFHOST_AI_MODEL,
                  SELFHOST_AI_NAME: e.SELFHOST_AI_NAME,
                  SELFHOST_AI_API: e.SELFHOST_AI_API,
                  SELFHOST_AI_AUTH_TYPE: e.SELFHOST_AI_AUTH_TYPE,
                  COMPOSE_PROJECT_NAME: "camelai-selfhost",
                  SELFHOST_BIND_ADDRESS: "127.0.0.1",
                  SELFHOST_APP_PORT: "3001",
                  SELFHOST_INTERNAL_APP_URL: "http://127.0.0.1:3001",
                  LOCAL_AUTH_BYPASS: "",
                  TURNSTILE_SITE_KEY: "",
                  TURNSTILE_SECRET_KEY: "",
                  CLOUDFLARE_ACCESS_TEAM_DOMAIN: e.AUTH_PROVIDER === "cloudflare-access" ? e.CLOUDFLARE_ACCESS_TEAM_DOMAIN : "",
                  CLOUDFLARE_ACCESS_AUD: e.AUTH_PROVIDER === "cloudflare-access" ? e.CLOUDFLARE_ACCESS_AUD : "",
                  CLOUDFLARE_ACCESS_DEFAULT_ORG_NAME: e.AUTH_PROVIDER === "cloudflare-access" ? e.AUTH_DEFAULT_ORG_NAME : "",
                  POMERIUM_AUTHENTICATE_URL: e.AUTH_PROVIDER.includes("pomerium") ? e.POMERIUM_AUTHENTICATE_URL : "",
                  POMERIUM_AUTHENTICATE_HOSTNAME: e.AUTH_PROVIDER === "bundled-pomerium" ? e.POMERIUM_AUTHENTICATE_HOSTNAME : "",
                  POMERIUM_JWKS_URL: e.AUTH_PROVIDER === "bundled-pomerium" ? `https://${e.MAIN_HOSTNAME}/.well-known/pomerium/jwks.json` : e.AUTH_PROVIDER === "pomerium" ? e.POMERIUM_JWKS_URL : "",
                  POMERIUM_ISSUER: e.AUTH_PROVIDER === "bundled-pomerium" ? e.MAIN_HOSTNAME : e.AUTH_PROVIDER === "pomerium" ? e.POMERIUM_ISSUER : "",
                  POMERIUM_AUDIENCE: e.AUTH_PROVIDER === "bundled-pomerium" ? e.MAIN_HOSTNAME : e.AUTH_PROVIDER === "pomerium" ? e.POMERIUM_AUDIENCE : "",
                  POMERIUM_DEFAULT_ORG_NAME: e.AUTH_PROVIDER.includes("pomerium") ? e.AUTH_DEFAULT_ORG_NAME : "",
                  POMERIUM_IDP_PROVIDER: e.AUTH_PROVIDER === "bundled-pomerium" ? e.POMERIUM_IDP_PROVIDER : "",
                  POMERIUM_IDP_PROVIDER_URL: e.AUTH_PROVIDER === "bundled-pomerium" ? e.POMERIUM_IDP_PROVIDER_URL : "",
                  POMERIUM_IDP_CLIENT_ID: e.AUTH_PROVIDER === "bundled-pomerium" ? e.POMERIUM_IDP_CLIENT_ID : "",
                  POMERIUM_IDP_CLIENT_SECRET: e.AUTH_PROVIDER === "bundled-pomerium" ? e.POMERIUM_IDP_CLIENT_SECRET : "",
                };
                const path = ".env.selfhost";
                let text = fs.readFileSync(path, "utf8");
                for (const [key, value] of Object.entries(updates)) {
                  const line = `${key}=${/^[A-Za-z0-9_./:@-]*$/.test(value) ? value : JSON.stringify(value)}`;
                  text = new RegExp(`^${key}=.*$`, "m").test(text)
                    ? text.replace(new RegExp(`^${key}=.*$`, "m"), line)
                    : `${text.trimEnd()}\n${line}\n`;
                }
                fs.writeFileSync(path, text, { mode: 0o600 });
                NODE
                unset SELFHOST_AI_API_KEY POMERIUM_IDP_CLIENT_SECRET
                chmod 600 .env.selfhost
                if [ "$TLS_MODE" = provided ]; then
                  install -d -m 0700 .selfhost/tls
                  aws secretsmanager get-secret-value --secret-id "$TLS_CERTIFICATE_SECRET_ARN" --query SecretString --output text > .selfhost/tls/tls.crt
                  aws secretsmanager get-secret-value --secret-id "$TLS_PRIVATE_KEY_SECRET_ARN" --query SecretString --output text > .selfhost/tls/tls.key
                  chmod 0600 .selfhost/tls/tls.crt .selfhost/tls/tls.key
                fi
                bun run selfhost:configure

                cat > /usr/local/sbin/camelai-selfhost-compose <<'COMPOSE'
                #!/usr/bin/env bash
                set -Eeuo pipefail
                cd /srv/camelai/repo
                args=(--env-file .env.selfhost -f docker-compose.selfhost.yml)
                if grep -q '^SELFHOST_AUTH_MODE=bundled-pomerium$' .env.selfhost; then
                  args+=(-f docker-compose.selfhost.pomerium.yml)
                fi
                args+=(-f docker-compose.selfhost.caddy.yml)
                if grep -Eq '^SELFHOST_TLS_MODE=(automatic|provided)$' .env.selfhost; then
                  args+=(-f docker-compose.selfhost.pomerium-loopback.yml)
                fi
                exec /usr/bin/docker compose "${args[@]}" "$@"
                COMPOSE
                chmod 0755 /usr/local/sbin/camelai-selfhost-compose

                cat > /etc/systemd/system/camelai-selfhost.service <<'UNIT'
                [Unit]
                Description=camelAI self-host release
                Requires=docker.service
                After=docker.service network-online.target
                Wants=network-online.target

                [Service]
                Type=oneshot
                RemainAfterExit=yes
                WorkingDirectory=/srv/camelai/repo
                ExecStartPre=/usr/local/bin/bun run selfhost:configure
                ExecStartPre=/usr/local/sbin/camelai-selfhost-compose pull
                ExecStart=/usr/local/sbin/camelai-selfhost-compose up --detach --remove-orphans --wait --wait-timeout 900
                ExecStop=/usr/local/sbin/camelai-selfhost-compose down
                TimeoutStartSec=1200

                [Install]
                WantedBy=multi-user.target
                UNIT

                cat > /usr/local/sbin/camelai-selfhost-upgrade <<'UPGRADE'
                #!/usr/bin/env bash
                set -Eeuo pipefail
                cd /srv/camelai/repo
                exec /usr/local/bin/bun run selfhost:upgrade -- "$@"
                UPGRADE
                chmod 0750 /usr/local/sbin/camelai-selfhost-upgrade

                systemctl daemon-reload
                systemctl enable --now camelai-selfhost
                bun run selfhost:doctor
                curl --fail --retry 30 --retry-delay 5 http://127.0.0.1:3001/api/selfhost/health
                # Health proves configured services are responding; these deep
                # smokes prove all attached execution runtimes are operational.
                bun --env-file=.env.selfhost run selfhost:container:smoke:project
                bun --env-file=.env.selfhost run selfhost:container:smoke:analysis
                bun --env-file=.env.selfhost run selfhost:container:smoke:db-query
                signal SUCCESS

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume

  BootstrapWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  BootstrapWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn:
      - DataVolumeAttachment
    Properties:
      Handle: !Ref BootstrapWaitHandle
      Timeout: "1800"
      Count: 1

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${Name}-eip

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  MainDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDns
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Ref MainHostname
      Type: A
      TTL: "60"
      ResourceRecords:
        - !GetAtt ElasticIp.PublicIp

  AppWildcardDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDns
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Sub "*.${AppVanityDomain}"
      Type: A
      TTL: "60"
      ResourceRecords:
        - !GetAtt ElasticIp.PublicIp

  PomeriumAuthenticateDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateBundledPomeriumDns
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Ref PomeriumAuthenticateHostname
      Type: A
      TTL: "60"
      ResourceRecords:
        - !GetAtt ElasticIp.PublicIp

  IframeWildcardDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateSeparateIframeDns
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Sub "*.${AppIframeDomain}"
      Type: A
      TTL: "60"
      ResourceRecords:
        - !GetAtt ElasticIp.PublicIp

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt ElasticIp.PublicIp
  DataVolumeId:
    Value: !Ref DataVolume
  MainUrl:
    Value: !Sub https://${MainHostname}
  SessionManagerCommand:
    Value: !Sub aws ssm start-session --target ${Instance}
  UpgradeCommand:
    Value: !Sub >-
      aws ssm send-command --instance-ids ${Instance}
      --document-name AWS-RunShellScript
      --parameters commands='sudo camelai-selfhost-upgrade
      --release selfhost-vX.Y.Z
      --manifest /secure/path/selfhost-release.json'
