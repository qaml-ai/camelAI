[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camelai-agent-runtime"
version = "0.1.0"
description = "Python SDK for the camelAI hosted agent runtime"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[tool.setuptools]
py-modules = ["agent_client"]
